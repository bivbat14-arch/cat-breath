<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Трекер Дыхания Кота</title>
  <style>
    body {
      margin: 0; padding: 0; background-color: #121212; color: #ffffff;
      font-family: sans-serif; display: flex; flex-direction: column;
      height: 100vh; overflow: hidden;
    }
    .screen {
      flex: 1; display: none; position: relative;
      height: calc(100vh - 60px); overflow-y: auto;
    }
    .screen.active { display: block; }
    .nav-bar {
      display: flex; background-color: #1e1e1e; border-top: 1px solid #333; height: 60px;
    }
    .nav-btn {
      flex: 1; background: transparent; border: none; color: #888;
      font-size: 16px; font-weight: bold; cursor: pointer;
    }
    .nav-btn.active { color: #00C851; }

    #video-container {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #000;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    
    /* УВЕЛИЧЕННЫЙ КВАДРАТ (было 100px, стало 250px) */
    #target-box {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 250px; height: 250px;
      border: 3px solid #00ff00; border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 255, 0, 0.5); pointer-events: none;
    }
    
    .controls {
      position: absolute; bottom: 0; width: 100%; padding: 20px;
      background: linear-gradient(transparent, rgba(0,0,0,0.9));
      text-align: center; box-sizing: border-box;
    }
    .time-selectors { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
    .time-btn {
      padding: 8px 20px; border-radius: 20px; border: 1px solid #00C851;
      background: transparent; color: #00C851; font-weight: bold; font-size: 14px;
    }
    .time-btn.selected { background: #00C851; color: #000; }
    .time-btn:disabled { opacity: 0.5; }
    #action-btn {
      padding: 15px 40px; font-size: 18px; background-color: #00C851;
      color: white; border: none; border-radius: 30px; font-weight: bold;
      width: 100%; max-width: 300px;
    }
    #action-btn.stop { background-color: #ff4444; }

    .diary-content { padding: 20px; box-sizing: border-box; }
    .chart-container {
      background-color: #1e1e1e; border-radius: 15px; padding: 15px;
      margin-bottom: 20px; height: 150px; position: relative;
    }
    .history-item {
      display: flex; justify-content: space-between; align-items: center;
      background-color: #1e1e1e; padding: 15px; border-radius: 10px; margin-bottom: 10px;
    }
    .clear-btn { background: none; color: #ff4444; border: none; font-size: 14px; }
  </style>
</head>
<body>

  <div id="scanner-screen" class="screen active">
    <div id="video-container">
      <video id="videoElement" autoplay playsinline muted></video>
      <div id="target-box"></div>
      <canvas id="hiddenCanvas" style="display: none;"></canvas>
      <div class="controls">
        <h2 id="bpm-display" style="margin: 0 0 5px 0; font-size: 32px;">--</h2>
        <p id="status-text" style="margin: 0 0 15px 0; font-size: 14px; color: #ddd;">Нажмите "Начать" и наведите на кота</p>
        <div class="time-selectors">
          <button class="time-btn selected" id="btn-15s" onclick="setDuration(15000)">15 сек</button>
          <button class="time-btn" id="btn-60s" onclick="setDuration(60000)">1 минута</button>
        </div>
        <button id="action-btn" onclick="toggleTracking()">НАЧАТЬ ЗАМЕР</button>
      </div>
    </div>
  </div>

  <div id="diary-screen" class="screen">
    <div class="diary-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="margin: 0;">Дневник ЧДД</h2>
        <button class="clear-btn" onclick="clearHistory()">Очистить</button>
      </div>
      <div class="chart-container">
        <h3 style="margin: 0 0 10px 0; font-size: 16px; color: #aaa;">Динамика дыхания</h3>
        <svg id="chart-svg" viewBox="0 0 300 100" preserveAspectRatio="none" style="width: 100%; height: 80%; overflow: visible;">
          <polyline id="chart-line" fill="none" stroke="#00C851" stroke-width="3" stroke-linejoin="round"></polyline>
          <g id="chart-dots"></g>
        </svg>
        <div id="chart-empty" style="display: none; text-align: center; color: #555; margin-top: 30px;">Нет данных</div>
      </div>
      <h3 style="margin: 0 0 15px 0; font-size: 16px; color: #aaa;">История замеров</h3>
      <div id="history-list"></div>
    </div>
  </div>

  <div class="nav-bar">
    <button class="nav-btn active" id="nav-scanner" onclick="switchTab('scanner')">📷 Сканер</button>
    <button class="nav-btn" id="nav-diary" onclick="switchTab('diary')">📓 Дневник</button>
  </div>

  <script>
    let isTracking = false;
    let durationMs = 15000;
    let dataLog = [];
    let startTime = 0;
    let animationFrameId = null;
    let stream = null;

    const video = document.getElementById('videoElement');
    const canvas = document.getElementById('hiddenCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const bpmDisplay = document.getElementById('bpm-display');
    const statusText = document.getElementById('status-text');
    const actionBtn = document.getElementById('action-btn');
    const btn15s = document.getElementById('btn-15s');
    const btn60s = document.getElementById('btn-60s');

    function switchTab(tabName) {
      document.getElementById('scanner-screen').classList.remove('active');
      document.getElementById('diary-screen').classList.remove('active');
      document.getElementById('nav-scanner').classList.remove('active');
      document.getElementById('nav-diary').classList.remove('active');

      if (tabName === 'scanner') {
        document.getElementById('scanner-screen').classList.add('active');
        document.getElementById('nav-scanner').classList.add('active');
        startCamera();
      } else {
        document.getElementById('diary-screen').classList.add('active');
        document.getElementById('nav-diary').classList.add('active');
        stopCamera();
        renderDiary();
      }
    }

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
        });
        video.srcObject = stream;
      } catch (err) {
        statusText.innerText = 'Ошибка камеры. Разрешите доступ в браузере.';
      }
    }

    function stopCamera() {
      if (stream) stream.getTracks().forEach(track => track.stop());
      if (isTracking) toggleTracking();
    }

    function setDuration(ms) {
      if (isTracking) return;
      durationMs = ms;
      btn15s.classList.toggle('selected', ms === 15000);
      btn60s.classList.toggle('selected', ms === 60000);
    }

    function toggleTracking() {
      if (isTracking) {
        isTracking = false;
        cancelAnimationFrame(animationFrameId);
        actionBtn.innerText = 'НАЧАТЬ ЗАМЕР';
        actionBtn.classList.remove('stop');
        statusText.innerText = 'Остановлено';
        btn15s.disabled = false;
        btn60s.disabled = false;
      } else {
        dataLog = [];
        startTime = Date.now();
        isTracking = true;
        bpmDisplay.innerText = '--';
        statusText.innerText = `Считаю... Держите камеру ${durationMs/1000} сек.`;
        actionBtn.innerText = 'ОСТАНОВИТЬ';
        actionBtn.classList.add('stop');
        btn15s.disabled = true;
        btn60s.disabled = true;
        processFrame();
      }
    }

    function processFrame() {
      if (!isTracking) return;

      if (canvas.width !== video.videoWidth) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
      }

      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // УВЕЛИЧЕННЫЙ КВАДРАТ (синхронизировано с CSS)
      const boxSize = 250; 
      const startX = (canvas.width - boxSize) / 2;
      const startY = (canvas.height - boxSize) / 2;
      
      const frameData = ctx.getImageData(startX, startY, boxSize, boxSize).data;
      let totalBrightness = 0;
      
      for (let i = 0; i < frameData.length; i += 4) {
        totalBrightness += 0.299 * frameData[i] + 0.587 * frameData[i + 1] + 0.114 * frameData[i + 2];
      }
      
      dataLog.push(totalBrightness / (boxSize * boxSize));

      if (Date.now() - startTime > durationMs) {
        calculateBPM();
        return;
      }
      animationFrameId = requestAnimationFrame(processFrame);
    }

    function calculateBPM() {
      if (dataLog.length < 50) return;

      const windowSize = 10;
      let smoothed = [];
      for (let i = 0; i <= dataLog.length - windowSize; i++) {
        let sum = 0;
        for (let j=0; j<windowSize; j++) sum += dataLog[i+j];
        smoothed.push(sum / windowSize);
      }

      let peaks = 0;
      for (let i = 1; i < smoothed.length - 1; i++) {
        if (smoothed[i] > smoothed[i - 1] && smoothed[i] > smoothed[i + 1]) {
          let startMean = Math.max(0, i - 5);
          let endMean = Math.min(smoothed.length, i + 5);
          let localSum = 0;
          for(let k=startMean; k<endMean; k++) localSum += smoothed[k];
          let localMean = localSum / (endMean - startMean);
          
          // ПОВЫШЕННАЯ ЧУВСТВИТЕЛЬНОСТЬ:
          // Было 1.01 (1% изменения), стало 1.002 (0.2% изменения)
          if (smoothed[i] > localMean * 1.002) peaks++;
        }
      }

      const durationInMinutes = (Date.now() - startTime) / 60000;
      const finalBpm = Math.round(peaks / durationInMinutes);
      
      bpmDisplay.innerText = `${finalBpm} вд/мин`;
      statusText.innerText = 'Замер сохранен в дневник.';
      
      saveMeasurement(finalBpm);
      toggleTracking(); 
    }

    function saveMeasurement(bpmVal) {
      if (bpmVal <= 0) return;
      const history = JSON.parse(localStorage.getItem('catBreathHistory') || '[]');
      const now = new Date();
      
      const newEntry = {
        id: Date.now(),
        date: now.toLocaleDateString('ru-RU'),
        time: now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }),
        bpm: bpmVal
      };
      
      history.unshift(newEntry);
      localStorage.setItem('catBreathHistory', JSON.stringify(history));
    }

    function clearHistory() {
      if (confirm('Удалить всю историю?')) {
        localStorage.removeItem('catBreathHistory');
        renderDiary();
      }
    }

    function renderDiary() {
      const history = JSON.parse(localStorage.getItem('catBreathHistory') || '[]');
      const listContainer = document.getElementById('history-list');
      const svgLine = document.getElementById('chart-line');
      const svgDots = document.getElementById('chart-dots');
      const emptyMsg = document.getElementById('chart-empty');
      const chartSvg = document.getElementById('chart-svg');

      listContainer.innerHTML = '';
      if (history.length === 0) {
        listContainer.innerHTML = '<p style="text-align:center; color:#555;">Нет замеров</p>';
        emptyMsg.style.display = 'block';
        chartSvg.style.display = 'none';
        return;
      }

      emptyMsg.style.display = 'none';
      chartSvg.style.display = 'block';

      history.forEach(entry => {
        const color = entry.bpm > 30 ? '#ffaa00' : '#00C851';
        listContainer.innerHTML += `
          <div class="history-item">
            <div>
              <div style="font-weight:bold">${entry.date}</div>
              <div style="font-size:12px; color:#888">${entry.time}</div>
            </div>
            <div style="font-size:24px; font-weight:bold; color:${color}">
              ${entry.bpm} <span style="font-size:12px; color:#888">вд/мин</span>
            </div>
          </div>
        `;
      });

      const chartData = [...history].reverse();
      const bpms = chartData.map(d => d.bpm);
      const maxBpm = Math.max(...bpms, 40);
      const minBpm = Math.min(...bpms, 10);
      
      let points = '';
      let dotsHtml = '';

      if (chartData.length === 1) {
        points = '0,50 300,50';
        dotsHtml = '<circle cx="150" cy="50" r="4" fill="#fff" stroke="#00C851" stroke-width="2"/>';
      } else {
        chartData.forEach((entry, index) => {
          const x = (index / (chartData.length - 1)) * 300;
          const y = 100 - (((entry.bpm - minBpm) / (maxBpm - minBpm || 1)) * 80 + 10);
          points += `${x},${y} `;
          dotsHtml += `<circle cx="${x}" cy="${y}" r="4" fill="#fff" stroke="#00C851" stroke-width="2"/>`;
        });
      }

      svgLine.setAttribute('points', points.trim());
      svgDots.innerHTML = dotsHtml;
    }

    window.onload = () => { startCamera(); };
  </script>
</body>
</html>
